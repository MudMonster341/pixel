<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BITS Dubai: The LUG Treasure Hunt</title>
  <link rel="icon" href="data:,">
  <!-- Vendored locally (ADR 0010): no CDN, no Google Fonts -- the packaged .exe has no internet.
       See vendor/README.md for what's here and under which licences. -->
  <link href="vendor/press-start-2p/press-start-2p.css" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #12131a; overflow: hidden; }
    #game { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="vendor/phaser/phaser.min.js"></script>
  <!-- Order matters: data first, then state, then scenes, then main.js starts the game -->
  <script src="src/items.js"></script>
  <script src="src/story.js"></script>
  <script src="src/ambient.js"></script>
  <!-- ADR 0018: talkable students (roles + facts, pure) and the campus animals (content + pure behaviour) -->
  <script src="src/campus-facts.js"></script>
  <script src="src/animals.js"></script>
  <script src="src/maps.js"></script>
  <script src="src/cutscenes.js"></script>
  <!-- ADR 0016 (in-world cutscene scripts): objective-routes.js (FB-0033 onboarding data) and
       scripts.js (SCRIPTS, content) need nothing but plain data/globals below them; the engine that
       actually runs a script (scripts-runtime.js) needs world.js's own globals (TILE, toPixel-adjacent
       helpers), so it loads right after world.js, further down. -->
  <script src="src/objective-routes.js"></script>
  <script src="src/scripts.js"></script>
  <script src="src/card.js"></script>
  <!-- W2 (the memory album): its slot rules (pure) for the Journal's Album page and the card's slideshow; reads buildCardConfig()'s `album` (card.js). -->
  <script src="src/album.js"></script>
  <script src="src/credits.js"></script>
  <!-- W3 (the birthday finale between the box and the card): its rules/schedule/fireworks (pure) and its drawing as shape lists; loads after card.js (renderCardText). -->
  <script src="src/finale.js"></script>
  <script src="src/finale-art.js"></script>
  <script src="src/maplogic.js"></script>
  <script src="src/state.js"></script>
  <!-- The small unskippable moments (unicorn, Mevin): the pacing table and rules, pure data/logic. -->
  <script src="src/moments.js"></script>
  <!-- Golden hour (the light moves from morning to dusk as the keys are found): pure phase/colour/lamp/dust logic, no Phaser. -->
  <script src="src/daylight.js"></script>
  <!-- Juice pass (key sparkle, mini-game shake/flash/confetti, emotes): pure plans plus shape-only drawing helpers; Phaser is only read when they are called. -->
  <script src="src/juice.js"></script>
  <!-- Selfie mode (P): crop/filename/caption/timeline rules (pure) plus the snapshot-and-download drawing; reads juiceBag (juice.js) and AudioManager (audio.js) only when called. -->
  <script src="src/selfie.js"></script>
  <script src="src/save.js"></script>
  <!-- M5 sound (docs/ROADMAP.md): needs GameState (state.js) and notifyStateChanged (state.js) above;
       everything below (dialog's key-awarded sfx, world.js, ui.js, the mini-games, the ending) calls
       into it, so it loads before all of them. -->
  <script src="src/audio.js"></script>
  <script src="src/dialog.js"></script>
  <!-- Mini-games (docs/ROADMAP.md M4): the pure data/logic files first (framework-data.js's MINIGAMES
       registry is read by world.js/ui.js below), then the Phaser scene shell and each game, which
       need drawPanel/uiText/COLORS/GAME_WIDTH -- loaded after ui.js. -->
  <script src="src/minigames/framework-data.js"></script>
  <script src="src/minigames/flappy-logic.js"></script>
  <script src="src/minigames/platformer-physics.js"></script>
  <script src="src/minigames/tower-logic.js"></script>
  <script src="src/minigames/hero-logic.js"></script>
  <script src="src/minigames/edi-logic.js"></script>
  <script src="src/scenes/world.js"></script>
  <script src="src/scripts-runtime.js"></script>
  <script src="src/scenes/ui.js"></script>
  <script src="src/minigames/framework-scene.js"></script>
  <script src="src/minigames/hero.js"></script>
  <script src="src/minigames/flappy.js"></script>
  <script src="src/minigames/tower.js"></script>
  <script src="src/minigames/edi.js"></script>
  <script src="src/scenes/cutscene.js"></script>
  <!-- The ending (docs/STORY.md "the box opens..."): box-opening.js/finale.js/card.js use
       DialogBox/drawPanel/uiText/COLORS/GAME_WIDTH from ui.js (above) and CARD_CONFIG_URL/
       CARD_PHOTOS_DIR/CARD_VIDEO_URL/BOX_VIDEO_URL/buildCardConfig from src/card.js (above). -->
  <script src="src/scenes/box-opening.js"></script>
  <script src="src/scenes/finale.js"></script>
  <script src="src/scenes/card.js"></script>
  <script src="src/scenes/credits.js"></script>
  <!-- FB-0075: the goodbye screen ("Quit" on the title, "Quit Game" in the pause menu); needs Button/makePanel/uiText/leaveGameTo from ui.js. -->
  <script src="src/scenes/goodbye.js"></script>
  <!-- FB-0032: the shared "live campus" backdrop for the title screen and the opening's own
       greeting/name/clothes screens (src/scenes/title.js and intro-greeting/-name/-customize.js). -->
  <script src="src/scenes/opening-backdrop.js"></script>
  <script src="src/scenes/title.js"></script>
  <!-- M3a opening (docs/STORY.md "Opening"): title's "Play" chains through these before 'boot' --
       all four use DialogBox/drawPanel/uiText/Button/COLORS from ui.js, loaded above. -->
  <script src="src/scenes/intro-greeting.js"></script>
  <script src="src/scenes/intro-name.js"></script>
  <script src="src/scenes/intro-customize.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
